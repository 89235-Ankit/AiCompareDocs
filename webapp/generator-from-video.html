<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Case Generator Tool from Video</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- SheetJS for Excel export -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo">TV</span>
      <div>
        <h1>Test Case Generator Tool from Video</h1>
        <p>Generate structured test cases from a recorded video walkthrough</p>
      </div>
    </div>
    <a class="home-link" href="index.html">&larr; Home</a>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="input">1. Inputs</button>
    <button class="tab-btn" data-tab="results" id="resultsTabBtn" disabled>2. Generated Test Cases</button>
  </nav>

  <main>
    <!-- ================= INPUT TAB ================= -->
    <section id="tab-input" class="tab-panel active">
      <form id="videoForm" novalidate>

        <!-- OneDrive Video URL -->
        <div class="field">
          <label class="field-label" for="videoUrl">
            OneDrive Path for the Video <span class="req">*</span>
          </label>
          <input type="text" id="videoUrl" value="https://avaloqgroupapc-my.sharepoint.com/" data-default="https://avaloqgroupapc-my.sharepoint.com/" />
          <span class="error-text" id="videoUrlError"></span>
        </div>

        <!-- Complete UI Flow / Navigation -->
        <div class="field">
          <label class="field-label">
            Need Test cases for Complete UI Flow / Navigation <span class="req">*</span>
          </label>
          <div class="radio-group" id="fullFlowGroup">
            <label class="radio"><input type="radio" name="fullFlow" value="Yes" checked /> <span>Yes</span></label>
            <label class="radio"><input type="radio" name="fullFlow" value="No" /> <span>No</span></label>
          </div>
        </div>

        <div class="grid-2">
          <!-- Targeted Functionality (enabled when fullFlow = No) -->
          <div class="field">
            <label class="field-label" for="targetedFunctionality">
              Targeted Functionalites <span class="optional">(Provide which specific Screen/Functionality you want to target)</span>
            </label>
            <textarea id="targetedFunctionality" rows="2" maxlength="600" disabled
              placeholder="Describe the specific functionality to target"></textarea>
            <span class="char-count"><span id="targetedFunctionalityCount">0</span>/600</span>
          </div>

          <!-- Keywords (enabled when fullFlow = No) -->
          <div class="field">
            <label class="field-label" for="videoKeywords">
              Keywords <span class="optional">(Provide which specific Screen/Functionality you want to target)</span>
            </label>
            <textarea id="videoKeywords" rows="2" maxlength="600" disabled
              placeholder="comma separated keywords"></textarea>
            <span class="char-count"><span id="videoKeywordsCount">0</span>/600</span>
          </div>
        </div>

        <!-- High Level Expectation -->
        <div class="field">
          <label class="field-label" for="highLevelExpectation">
            High Level Expectation
          </label>
          <textarea id="highLevelExpectation" rows="2" maxlength="600"
            placeholder="Describe the high level expectation"></textarea>
          <span class="char-count"><span id="highLevelExpectationCount">0</span>/600</span>
        </div>

        <!-- Test Case Level -->
        <div class="field">
          <label class="field-label">Test Case Level <span class="req">*</span></label>
          <div class="radio-group" id="levelGroup">
            <label class="radio"><input type="radio" name="testLevel" value="Unit" checked /> <span>Unit</span></label>
            <label class="radio"><input type="radio" name="testLevel" value="System" /> <span>System</span></label>
            <label class="radio"><input type="radio" name="testLevel" value="System Integration" /> <span>System Integration</span></label>
            <label class="radio"><input type="radio" name="testLevel" value="Business End to End (E2E)/UAT" /> <span>Business End to End (E2E)/UAT</span></label>
          </div>
        </div>

        <!-- Reference Test Cases -->
        <div class="field">
          <label class="field-label">
            Reference Test Cases
          </label>
          <div class="upload-box">
            <input type="file" id="refFiles" accept=".xlsx,.xls" multiple hidden />
            <button type="button" class="btn btn-outline" id="refBrowseBtn">Select Excel Files</button>
            <span class="upload-note">Maximum 5 files</span>
          </div>
          <ul class="file-list" id="refFileList"></ul>
        </div>

        <div class="actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="generateBtn">Generate</button>
        </div>
      </form>
    </section>

    <!-- ================= RESULTS TAB ================= -->
    <section id="tab-results" class="tab-panel">
      <div class="results-header">
        <div>
          <h2>Generated Test Cases</h2>
          <p id="resultsSummary" class="results-summary"></p>
        </div>
        <div class="results-actions">
          <button type="button" class="btn btn-outline" id="backBtn">Back to Inputs</button>
          <button type="button" class="btn btn-primary" id="exportBtn">Export to Excel</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="resultsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Level</th>
              <th>Precondition</th>
              <th>Test Steps</th>
              <th>Expected Result</th>
              <th>Priority</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="video-app.js"></script>
</body>
</html>
