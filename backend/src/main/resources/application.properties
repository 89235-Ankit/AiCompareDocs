server.port=8080

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Give pdfcompare / PDFBox some breathing room for larger PDFs
spring.mvc.async.request-timeout=120000

# --- Acrolinx grammar checking ---
# When disabled (default) grammar checks fall back to built-in heuristic rules.
acrolinx.enabled=false
acrolinx.base-url=
acrolinx.api-token=
acrolinx.client-signature=content-verify-tool
acrolinx.guidance-profile=
acrolinx.max-poll-attempts=20
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.5-flash-lite
gemini.url=https://generativelanguage.googleapis.com/v1beta